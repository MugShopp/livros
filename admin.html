<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estatísticas dos Livros</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f2ec;--card:#fff;--ink:#1f2d36;--muted:#6a747a;--accent:#b7623b;--line:#e4ddd4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.wrap{width:min(920px,calc(100% - 28px));margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
h1{font-family:Georgia,serif;margin:0;font-size:clamp(2rem,5vw,3.2rem)}p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.num{font-size:2.4rem;font-weight:800;margin-top:8px}.label{color:var(--muted);font-size:.92rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px}
.row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
input,button{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid var(--line)}input{width:100%;margin:6px 0 12px}button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}
#dashboard{display:none}#msg{min-height:24px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div style="color:#b7623b;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem">Área administrativa</div>
      <h1>Estatísticas dos livros</h1>
      <p>Somente visitas à página e cliques nos botões da Amazon.</p>
    </div>
    <button id="logout" style="display:none">Sair</button>
  </div>

  <section id="login" class="panel">
    <h2>Entrar</h2>
    <p>Use o e-mail e a senha do administrador cadastrados no Supabase.</p>
    <label>E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label>Senha</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <p id="msg"></p>
  </section>

  <section id="dashboard">
    <div class="grid">
      <div class="card"><div class="label">Visitas</div><div id="visits" class="num">0</div></div>
      <div class="card"><div class="label">Cliques na Amazon</div><div id="clicks" class="num">0</div></div>
      <div class="card"><div class="label">Taxa de clique</div><div id="ctr" class="num">0%</div></div>
    </div>

    <div class="panel">
      <h2>Cliques por botão</h2>
      <div id="buttons"></div>
    </div>
  </section>
</div>

<script>
const cfg = window.LIVROS_STATS_CONFIG || {};
const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
const login = document.getElementById('login');
const dashboard = document.getElementById('dashboard');
const logout = document.getElementById('logout');
const msg = document.getElementById('msg');

function pretty(name){
  const map={
    hero_ver_amazon:'Ver na Amazon (topo)',
    conhecer_livro:'Conhecer A Vida Que Eles Me Deram',
    conhecer_kyara:'Conhecer Kyara',
    final_ver_amazon:'Ver livros na Amazon (final)'
  };
  return map[name] || name || 'Outro botão';
}

async function loadStats(){
  const { data, error } = await db.from('site_events')
    .select('event_name,button_name');
  if(error){ msg.textContent='Não foi possível carregar as estatísticas.'; return; }

  const visits=data.filter(x=>x.event_name==='visit').length;
  const clicks=data.filter(x=>x.event_name==='amazon_click').length;
  document.getElementById('visits').textContent=visits;
  document.getElementById('clicks').textContent=clicks;
  document.getElementById('ctr').textContent=visits ? ((clicks/visits)*100).toFixed(1)+'%' : '0%';

  const counts={};
  data.filter(x=>x.event_name==='amazon_click').forEach(x=>counts[x.button_name]=(counts[x.button_name]||0)+1);
  const holder=document.getElementById('buttons');
  holder.innerHTML='';
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([name,count])=>{
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=`<span>${pretty(name)}</span><strong>${count}</strong>`;
    holder.appendChild(row);
  });
  if(!Object.keys(counts).length) holder.innerHTML='<p>Ainda não houve cliques.</p>';
}

async function refreshAuth(){
  const { data:{session} } = await db.auth.getSession();
  const signed=!!session;
  login.style.display=signed?'none':'block';
  dashboard.style.display=signed?'block':'none';
  logout.style.display=signed?'inline-block':'none';
  if(signed) loadStats();
}

document.getElementById('loginBtn').onclick=async()=>{
  msg.textContent='Entrando...';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {error}=await db.auth.signInWithPassword({email,password});
  msg.textContent=error ? 'E-mail ou senha incorretos.' : '';
  refreshAuth();
};
logout.onclick=async()=>{await db.auth.signOut();refreshAuth()};
db.auth.onAuthStateChange(()=>refreshAuth());
refreshAuth();
</script>
</body>
</html>
